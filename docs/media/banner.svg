<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#111116" />
      <stop offset="100%" stop-color="#181820" />
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F3F46" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#52525B" />
    </linearGradient>

    <!-- Logo Glow Aura -->
    <radialGradient id="aura-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>

    <!-- Text Loop Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#27272A" stop-opacity="0.7" />
    </linearGradient>

    <!-- Mascot Emblem Shading -->
    <radialGradient id="emblem-rim" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E4E4E7" />
      <stop offset="100%" stop-color="#71717A" />
    </radialGradient>
    <radialGradient id="emblem-face" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#F4F4F6" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </radialGradient>
  </defs>

  <style>
    .title-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .body-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    .mono-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Banner Container -->
  <rect x="2" y="2" width="996" height="276" rx="20" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Background Comic Paneling Watermark Guidelines -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <rect x="680" y="25" width="280" height="230" rx="8" />
    <line x1="680" y1="135" x2="960" y2="135" />
    <line x1="820" y1="25" x2="820" y2="135" />
    <rect x="700" y="45" width="100" height="70" rx="4" />
    <rect x="840" y="45" width="100" height="70" rx="4" />
    <rect x="700" y="155" width="240" height="85" rx="4" />
  </g>

  <!-- Subtle Radial Glow behind Logo -->
  <circle cx="125" cy="140" r="120" fill="url(#aura-glow)" />

  <!-- Logo Emblem Container -->
  <g transform="translate(65, 75)">
    <!-- Outer Glow Frame -->
    <rect x="0" y="0" width="120" height="120" rx="32" fill="#18181B" stroke="#27272A" stroke-width="2" />
    <rect x="2" y="2" width="116" height="116" rx="30" fill="none" stroke="url(#title-grad)" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Mascot Emblem Graphic -->
    <rect x="15" y="15" width="90" height="90" rx="28" fill="url(#emblem-rim)" stroke="#09090B" stroke-width="2" />
    <rect x="20" y="20" width="80" height="80" rx="24" fill="url(#emblem-face)" stroke="#09090B" stroke-width="1.2" />
    <ellipse cx="40" cy="71" rx="8" ry="5" fill="#A1A1AA" opacity="0.4" />
    <ellipse cx="80" cy="71" rx="8" ry="5" fill="#A1A1AA" opacity="0.4" />
    <circle cx="45" cy="60" r="5.5" fill="#09090B" />
    <circle cx="43" cy="58" r="2" fill="#FFFFFF" />
    <circle cx="75" cy="60" r="5.5" fill="#09090B" />
    <circle cx="73" cy="58" r="2" fill="#FFFFFF" />
    <path d="M 54 69 Q 60 74 66 69" fill="none" stroke="#09090B" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Content Block -->
  <g transform="translate(225, 0)">
    <!-- Top Pill Tag: Meta AI Hackathon -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="310" height="24" rx="12" fill="url(#badge-bg)" stroke="#3F3F46" stroke-width="1" />
      <circle cx="12" cy="12" r="4" fill="#38BDF8" />
      <text x="24" y="16" class="mono-font" font-size="11" font-weight="600" fill="#E4E4E7" letter-spacing="0.5">META GLOBAL AI HACKATHON · INDIE</text>
    </g>

    <!-- Main Title: InkLoop -->
    <text x="0" y="118" class="title-font" font-size="52" fill="#FFFFFF" letter-spacing="-1">
      Ink<tspan fill="url(#title-grad)">Loop</tspan>
    </text>

    <!-- Studio Badge next to Title -->
    <g transform="translate(210, 86)">
      <rect x="0" y="0" width="105" height="24" rx="6" fill="#1E1B4B" stroke="#4338CA" stroke-width="1" />
      <text x="52" y="16" class="mono-font" font-size="10.5" font-weight="700" fill="#A5B4FC" text-anchor="middle" letter-spacing="1">STUDIO OS</text>
    </g>

    <!-- Short Description Line 1 -->
    <text x="0" y="152" class="body-font" font-size="16.5" font-weight="500" fill="#F4F4F5" letter-spacing="-0.2">
      Autonomous comic &amp; manga production engine powered by Meta AI models.
    </text>

    <!-- Short Description Line 2 -->
    <text x="0" y="178" class="body-font" font-size="14.5" fill="#A1A1AA">
      Guaranteed character continuity, multi-angle anchor sheets &amp; deterministic canvas lettering.
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 206)">
      <!-- Badge 1: Muse Spark 1.3 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="28" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#6366F1" />
        <text x="26" y="18" class="body-font" font-size="12" font-weight="600" fill="#E4E4E7">Meta Muse Spark 1.3</text>
      </g>

      <!-- Badge 2: Muse Image 1.0 -->
      <g transform="translate(178, 0)">
        <rect x="0" y="0" width="168" height="28" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#38BDF8" />
        <text x="26" y="18" class="body-font" font-size="12" font-weight="600" fill="#E4E4E7">Meta Muse Image 1.0</text>
      </g>

      <!-- Badge 3: SAM 3.1 -->
      <g transform="translate(356, 0)">
        <rect x="0" y="0" width="132" height="28" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#10B981" />
        <text x="26" y="18" class="body-font" font-size="12" font-weight="600" fill="#E4E4E7">Meta SAM 3.1</text>
      </g>

      <!-- Badge 4: Deterministic Canvas -->
      <g transform="translate(498, 0)">
        <rect x="0" y="0" width="186" height="28" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#F59E0B" />
        <text x="26" y="18" class="body-font" font-size="12" font-weight="600" fill="#E4E4E7">Deterministic Canvas</text>
      </g>
    </g>
  </g>
</svg>