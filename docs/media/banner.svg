<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240">
  <defs>
    <!-- Studio Background Gradient (Carbon to Deep Zinc) -->
    <linearGradient id="studio-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181A" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>

    <!-- Studio Card Border Gradient -->
    <linearGradient id="studio-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38383E" />
      <stop offset="50%" stop-color="#242428" />
      <stop offset="100%" stop-color="#2E2E34" />
    </linearGradient>

    <!-- Logo Box Surface -->
    <linearGradient id="logo-box-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222227" />
      <stop offset="100%" stop-color="#161619" />
    </linearGradient>

    <!-- Character Shading (ink-dark studio palette) -->
    <radialGradient id="char-hood-grad" cx="44%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#71717A" />
      <stop offset="45%" stop-color="#52525B" />
      <stop offset="100%" stop-color="#27272A" />
    </radialGradient>
    <radialGradient id="char-face-grad" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F4F4F6" />
      <stop offset="100%" stop-color="#E4E4E7" />
    </radialGradient>
    <radialGradient id="char-belly-glow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#A1A1AA" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#52525B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="char-leg-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#52525B" />
      <stop offset="100%" stop-color="#27272A" />
    </linearGradient>

    <!-- Badge Background -->
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C1C20" />
      <stop offset="100%" stop-color="#151518" />
    </linearGradient>
  </defs>

  <!-- Container Surface -->
  <rect x="1.5" y="1.5" width="997" height="237" rx="14" fill="url(#studio-bg)" stroke="url(#studio-border)" stroke-width="1.5" />

  <!-- Subtle Manga Panel Wireframe (Right Watermark) -->
  <g opacity="0.18" stroke="#44444C" stroke-width="1.2" fill="none">
    <rect x="755" y="28" width="205" height="184" rx="6" />
    <line x1="755" y1="116" x2="960" y2="116" />
    <line x1="855" y1="28" x2="855" y2="116" />
    <rect x="765" y="38" width="80" height="68" rx="4" stroke="#2B2B32" stroke-dasharray="3 3" />
    <rect x="865" y="38" width="85" height="68" rx="4" stroke="#2B2B32" stroke-dasharray="3 3" />
    <rect x="765" y="126" width="185" height="76" rx="4" stroke="#2B2B32" stroke-dasharray="3 3" />
  </g>

  <!-- Left: Authentic Studio Logo Frame (Matches App Sidebar Switcher) -->
  <g transform="translate(44, 42)">
    <rect x="0" y="0" width="112" height="112" rx="22" fill="url(#logo-box-bg)" stroke="#383840" stroke-width="1.5" />
    
    <!-- Authentic Mascot Vector (ink-dark studio theme from assets/agent/pose-01-neutral.svg) -->
    <g transform="translate(13, 8) scale(0.305)">
      <!-- Ground Shadow -->
      <ellipse cx="140" cy="272" rx="65" ry="10" fill="#09090B" opacity="0.6" />

      <!-- Legs -->
      <path d="M 90 218 C 90 234, 91 250, 93 259 C 95 266, 104 268, 115 268 C 126 268, 134 265, 135 258 C 136 248, 136 232, 136 224 Z" fill="url(#char-leg-grad)" stroke="#71717A" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M 144 224 C 144 232, 144 248, 145 258 C 146 265, 154 268, 165 268 C 176 268, 185 266, 187 259 C 189 250, 190 234, 190 218 Z" fill="url(#char-leg-grad)" stroke="#71717A" stroke-width="1.8" stroke-linejoin="round" />
      
      <!-- Arms -->
      <path d="M 80 120 C 58 134, 46 168, 46 198 C 46 213, 55 220, 64 218 Z" fill="url(#char-hood-grad)" stroke="#71717A" stroke-width="1.8" />
      <path d="M 200 120 C 222 134, 234 168, 234 198 C 234 213, 225 220, 216 218 Z" fill="url(#char-hood-grad)" stroke="#71717A" stroke-width="1.8" />
      
      <!-- Body / Hood -->
      <path d="M 140 37 C 178 37, 198 58, 201 94 C 203 118, 211 148, 211 182 C 211 217, 192 238, 140 238 C 88 238, 69 217, 69 182 C 69 148, 77 118, 79 94 C 82 58, 102 37, 140 37 Z" fill="url(#char-hood-grad)" stroke="#71717A" stroke-width="2" stroke-linejoin="round" />
      <ellipse cx="140" cy="178" rx="48" ry="42" fill="url(#char-belly-glow)" />

      <!-- Face Window -->
      <rect x="90" y="57" width="100" height="78" rx="38" ry="36" fill="#27272A" stroke="#18181B" stroke-width="1.6" />
      <rect x="93.5" y="60.5" width="93" height="71" rx="35" ry="33" fill="url(#char-face-grad)" />
      
      <!-- Cheeks -->
      <ellipse cx="109" cy="106" rx="10" ry="7" fill="#A1A1AA" opacity="0.4" />
      <ellipse cx="171" cy="106" rx="10" ry="7" fill="#A1A1AA" opacity="0.4" />
      
      <!-- Eyes -->
      <circle cx="116" cy="95" r="6.2" fill="#09090B" />
      <circle cx="114.2" cy="93" r="2.1" fill="#FFFFFF" />
      <circle cx="164" cy="95" r="6.2" fill="#09090B" />
      <circle cx="162.2" cy="93" r="2.1" fill="#FFFFFF" />
      
      <!-- Mouth -->
      <path d="M 134 101.5 Q 140 106.5 146 101.5" fill="none" stroke="#09090B" stroke-width="2.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Center Content -->
  <g transform="translate(178, 38)">
    <!-- Hackathon Header Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="272" height="22" rx="11" fill="url(#badge-bg)" stroke="#2E2E35" stroke-width="1" />
      <circle cx="11" cy="11" r="3.5" fill="#D4D4D8" />
      <text x="22" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#A1A1AA" letter-spacing="0.08em">META GLOBAL AI HACKATHON · INDIE</text>
    </g>

    <!-- Brand Header Lockup: Name + Context -->
    <g transform="translate(0, 50)">
      <text x="0" y="0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" letter-spacing="-0.02em">InkLoop</text>
      <line x1="158" y1="-23" x2="158" y2="-3" stroke="#393942" stroke-width="1.5" />
      <text x="174" y="-8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12" font-weight="600" fill="#888892" letter-spacing="0.14em">MANGA &amp; COMIC STUDIO</text>
    </g>

    <!-- Short Description -->
    <g transform="translate(0, 83)">
      <text x="0" y="0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#E4E4E7">Autonomous comic, manga, and visual storytelling production engine powered by Meta AI models.</text>
      <text x="0" y="21" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="13" font-weight="400" fill="#888892">Guaranteed character continuity, canonical model sheets &amp; deterministic canvas lettering.</text>
    </g>

    <!-- Badges Row -->
    <g transform="translate(0, 134)">
      <!-- Badge 1: Meta Muse Spark 1.3 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="26" rx="6" fill="url(#badge-bg)" stroke="#2E2E35" stroke-width="1" />
        <circle cx="12" cy="13" r="3" fill="#A1A1AA" />
        <text x="22" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" fill="#D4D4D8">Meta Muse Spark 1.3</text>
      </g>

      <!-- Badge 2: Meta Muse Image 1.0 -->
      <g transform="translate(170, 0)">
        <rect x="0" y="0" width="162" height="26" rx="6" fill="url(#badge-bg)" stroke="#2E2E35" stroke-width="1" />
        <circle cx="12" cy="13" r="3" fill="#A1A1AA" />
        <text x="22" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" fill="#D4D4D8">Meta Muse Image 1.0</text>
      </g>

      <!-- Badge 3: Meta SAM 3.1 -->
      <g transform="translate(342, 0)">
        <rect x="0" y="0" width="118" height="26" rx="6" fill="url(#badge-bg)" stroke="#2E2E35" stroke-width="1" />
        <circle cx="12" cy="13" r="3" fill="#A1A1AA" />
        <text x="22" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" fill="#D4D4D8">Meta SAM 3.1</text>
      </g>

      <!-- Badge 4: Deterministic Canvas -->
      <g transform="translate(470, 0)">
        <rect x="0" y="0" width="168" height="26" rx="6" fill="url(#badge-bg)" stroke="#2E2E35" stroke-width="1" />
        <circle cx="12" cy="13" r="3" fill="#A1A1AA" />
        <text x="22" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" fill="#D4D4D8">Deterministic Canvas</text>
      </g>
    </g>
  </g>
</svg>